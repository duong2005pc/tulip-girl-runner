<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tulip Girl Runner</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root { --h: 100vh; }
@supports (height: 100dvh) {
    :root { --h: 100dvh; }
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
    background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #e0f7fa 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}

.game-container {
    text-align: center;
    width: 100%;
    max-width: 860px;
    background: rgba(255, 255, 255, 0.8);
    padding: 20px 25px;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(216, 27, 96, 0.12);
}

h1 {
    color: #d81b60;
    margin-bottom: 15px;
    font-size: 24px;
}

canvas {
    border: 4px solid #81c784;
    border-radius: 16px;
    display: block;
    margin: 0 auto;
    width: min(100%, 800px, calc((var(--h) - 56px) * 2.666));
    height: auto;
    background-color: #c2e9fb;
    touch-action: none;
}

.guide {
    margin-top: 14px;
    color: #2e7d32;
    font-size: 15px;
    font-weight: 500;
}

/* ĐIỆN THOẠI / MÁY TÍNH BẢNG: game phủ kín màn hình */
@media (hover: none) and (pointer: coarse) {
    body { padding: 0; }
    .game-container {
        position: fixed;
        inset: 0;
        max-width: none;
        border-radius: 0;
        padding: 6px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    h1 { display: none; }
    .guide { font-size: 12px; margin-top: 6px; }
}

/* ĐANG CẦM DỌC: quay game 90 độ để thành màn hình ngang */
@media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    :root { --h: 100vw; }
    .game-container {
        inset: auto;
        top: 0;
        left: 100vw;
        width: 100vh;
        width: 100dvh;
        height: 100vw;
        transform-origin: top left;
        transform: rotate(90deg);
    }
}
    </style>
</head>

    </div>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- KỈ LỤC CHUNG (FIREBASE) ---
const DB_URL = "https://tulip-girl-runner-default-rtdb.asia-southeast1.firebasedatabase.app";
const hasDB = /^https:\/\//.test(DB_URL);
const API = DB_URL.replace(/\/+$/, "");

let globalRecord = { score: 0, name: "" };
let recordLoaded = false;

async function loadRecord() {
    if (!hasDB) return;
    try {
        const res = await fetch(API + "/record.json");
        const data = await res.json();
        if (data && typeof data.score === "number") {
            globalRecord = { score: data.score, name: String(data.name || "").slice(0, 12) };
        }
        recordLoaded = res.ok;
    } catch (e) { }
}

async function saveRecord(newScore) {
    let saved = "";
    try { saved = localStorage.getItem("tulipName") || ""; } catch (e) { }
    let name = prompt("🎉 Bạn phá kỉ lục! Nhập tên của bạn (tối đa 12 ký tự):", saved);
    name = (name || "Ẩn danh").trim().slice(0, 12) || "Ẩn danh";
    try { localStorage.setItem("tulipName", name); } catch (e) { }
    try {
        const res = await fetch(API + "/record.json", {
            method: "PUT",
            body: JSON.stringify({ score: newScore, name: name })
        });
        if (res.ok) {
            globalRecord = { score: newScore, name: name };
            return true;
        }
    } catch (e) { }
    await loadRecord();
    return false;
}

async function checkRecord(finalScore) {
    if (!hasDB) return;
    await loadRecord();
    if (!isGameOver || !recordLoaded) return;

    let broke = false;
    if (finalScore > globalRecord.score) {
        broke = await saveRecord(finalScore);
    }
    if (!isGameOver) return;

    const who = globalRecord.name ? " - " + globalRecord.name : "";
    const msg = broke
        ? "🎉 KỈ LỤC MỚI: " + globalRecord.score + who
        : "🏆 Kỉ lục: " + globalRecord.score + who;
    ctx.fillStyle = "#ffeb3b";
    ctx.textAlign = "center";
    ctx.font = "bold 20px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(msg, canvas.width / 2, 235);
}

// --- ÂM THANH (NHẠC NỀN TỪ FILE MP3 + TIẾNG BÍP KHI NHẢY) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

const bgm = new Audio("nhac.mp3");
bgm.loop = true;
bgm.volume = 0.4;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (bgm.paused) bgm.play().catch(() => { });
}

function playJumpSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(420, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(760, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function playGameOverSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.32);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
}
